# Temporary first-start configuration (scripts/init-tls.sh): plain HTTP while the Let's Encrypt certificate
# is obtained. Replaced by conf.d/kwa-ba.conf afterwards.
server {
    listen 80;
    listen [::]:80;
    server_name kwa-ba.com www.kwa-ba.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 503; }
}
