name: Nightly

on:
  schedule:
    - cron: '0 1 * * *' # 1 h UTC (3 h à Paris en été, 2 h en hiver)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Les CVE publiées depuis la construction de l'image : celle du dernier manifest est rescannée chaque nuit.
  trivy-main-image:
    name: Trivy (image du dernier manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-manifest-tools

      - id: name
        # Image du dernier manifest ; à défaut (aucun manifest commité), la dernière image de main
        run: |
          image=$(node .github/scripts/manifest/latest.mjs --field services.server.image)
          echo "image=${image:-ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/afristay-server:main}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker pull "${{ steps.name.outputs.image }}"

      - uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ steps.name.outputs.image }}

  # Nouvelles CVE dans les dépendances, et secrets sur tout l'historique (toutes branches)
  security:
    name: Security
    uses: ./.github/workflows/_security-checks.yml
    with:
      back: true
      front: true
      gitleaks-log-opts: --all
