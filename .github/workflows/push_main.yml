name: Main

on:
  push:
    branches: [main]
    # Seuls le serveur et la CI produisent une nouvelle image ; le client est déployé par Vercel
    paths:
      - 'server/**'
      - '.github/**'

concurrency:
  group: main-push
  cancel-in-progress: false # chaque commit de main garde son image

permissions:
  contents: read

jobs:
  push-image:
    name: Image
    uses: ./.github/workflows/_main-push-image.yml
    permissions:
      contents: read
      packages: write
