name: Gitleaks scan
description: >-
  Cherche des secrets dans une plage de commits (valeurs masquées dans les logs).
  Le dépôt doit être cloné avec son historique (fetch-depth: 0). Faux positifs vérifiés : .gitleaksignore.

inputs:
  log-opts:
    description: Plage passée à git log (ex. « base..head », ou « --all » pour tout l'historique)
    required: true

runs:
  using: composite
  steps:
    - name: Gitleaks
      shell: bash
      env:
        LOG_OPTS: ${{ inputs.log-opts }}
      run: |
        docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE":/repo:ro \
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
          git /repo --redact --verbose --no-banner --log-opts="--no-merges ${LOG_OPTS}"
