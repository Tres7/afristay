name: Setup manifest tools
description: Node 24 et dépendances des scripts de manifest (.github/scripts/manifest).

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: .github/scripts/manifest/package-lock.json

    - shell: bash
      run: npm ci --prefix .github/scripts/manifest --no-audit --no-fund
