# Services des tests du serveur, démarrés à la demande par pytest (server/tests/services.py).
# Projet séparé (kwaba-test) : n'interfère pas avec la stack de développement de compose.yaml.
name: kwaba-test

services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: kwaba
      POSTGRES_USER: kwaba
      POSTGRES_PASSWORD: kwaba-test
    ports:
      - "127.0.0.1:55432:5432"
    # Données en mémoire : rapide, et rien ne survit à l'arrêt du conteneur
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # TCP: during initialisation, the temporary server only listens on the local socket, then restarts
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kwaba -d kwaba"]
      interval: 1s
      timeout: 3s
      retries: 30
