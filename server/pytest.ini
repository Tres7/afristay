[pytest]
DJANGO_SETTINGS_MODULE = config.settings
testpaths = tests
python_files = test_*.py
addopts = --strict-markers -ra --import-mode=importlib
# Les marqueurs sont posés automatiquement d'après le dossier (voir tests/conftest.py)
markers =
    unit: sans base de données ni réseau (tests/unit)
    integration: PostgreSQL réelle (tests/integration)
    broker: PostgreSQL et RabbitMQ réels (tests/broker)
