# Développement uniquement. La base, pgAdmin et RabbitMQ n'écoutent que sur 127.0.0.1 (invisibles du réseau local) ;
# pgAdmin et la console RabbitMQ ne doivent jamais être déployés en production.
name: kwaba

services:
  # ========================
  # Base de donnees
  # ========================
  db:
    image: postgres:16-bookworm
    container_name: kwaba-db
    env_file:
      - server/.env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ========================
  # pgAdmin
  # ========================
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: kwaba-pgadmin
    env_file:
      - server/.env
    # environment:
    #   PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
    #   PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5051:80"
    depends_on:
      db:
        condition: service_healthy

  # ========================
  # Backend Django
  # ========================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kwaba-backend
    # Pas root : __pycache__ et mediafiles sont écrits dans le dossier monté avec ton uid
    user: "${UID:-1000}:${GID:-1000}"
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./server:/app
    ports:
      - "8000:8000"
    env_file:
      - server/.env
    depends_on:
      db:
        condition: service_healthy

  # ========================
  # Frontend Next.js
  # ========================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: dev # l'image de production (cible par défaut) sert au VPS
    container_name: kwaba-frontend
    # Pas root : .next est écrit dans le dossier monté avec ton uid (sinon tsc et le hook pre-push échouent)
    user: node
    command: npm run dev
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - client/.env
    environment:
      - INTERNAL_API_URL=http://backend:8000/api
      # Docker Desktop (Windows/macOS) ne propage pas les événements fichiers : polling
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

  rabbitmq:
    image: rabbitmq:4-management
    env_file:
      - server/.env
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    # environment:
    #   RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
    #   RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  consumer:
    build:
      context: ./server
    user: "${UID:-1000}:${GID:-1000}"
    command: python manage.py consume_events
    volumes:
      - ./server:/app
    env_file:
      - server/.env
    depends_on:
      - rabbitmq
      - db
    restart: on-failure

  # Relais de l'outbox de messagerie : publie les notifications échues (une seule instance, voir ADR-016)
  messaging-relay:
    build:
      context: ./server
    user: "${UID:-1000}:${GID:-1000}"
    command: python manage.py relay_messaging_outbox
    volumes:
      - ./server:/app
    env_file:
      - server/.env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: on-failure

  # Worker des paiements : expiration des réservations non payées, versements aux hôtes, remboursements
  paiements-worker:
    build:
      context: ./server
    command: python manage.py traiter_paiements
    volumes:
      - ./server:/app
    env_file:
      - server/.env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
  rabbitmq_data:
