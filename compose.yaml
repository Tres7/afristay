services:
 db:
  image: postgres:16-bookworm
  container_name: postgres
  environment:
   POSTGRES_DB: ${POSTGRES_DB}
   POSTGRES_USER: ${POSTGRES_USER}
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  ports:
   - "5433:5432" #You can change it according to your needs: "XXXX:YYYY": "XXXX" port on your machine and "YYYY" port on the container. Base image uses port 5432 for both
  volumes:
   - afristay_db:/var/lib/postgresql/data
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U afristay -d afristay"]
   interval: 10s
   timeout: 5s
   retries: 20

 pgadmin:
  image: dpage/pgadmin4:latest
  container_name: pgadmin
  environment:
   PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL} #pay attention to the email format, it should be in the format of an email address
   PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
  ports:
    - "5051:80" #You can change it according to your needs
  depends_on:
    db:
      condition: service_healthy

volumes:
    afristay_db: