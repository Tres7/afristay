services:
  # ========================
  # Base de donnees
  # ========================
  db:
    image: postgres:16-bookworm
    container_name: afristay-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - afristay_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ========================
  # pgAdmin
  # ========================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: afristay-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5051:80"
    depends_on:
      db:
        condition: service_healthy

  # ========================
  # Backend Django
  # ========================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: afristay-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./server:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # ========================
  # Frontend Next.js
  # ========================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: afristay-frontend
    command: npm run dev
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - INTERNAL_API_URL=http://backend:8000/api
    depends_on:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"    # port AMQP (pika se connecte ici)
      - "15672:15672"  # management web interface
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  consumer:
    build:
      context: ./server
    command: python manage.py consume_events
    volumes:
      - ./server:/app
    env_file:
      - .env
    depends_on:
      - rabbitmq
      - db
    restart: on-failure



volumes:
  afristay_db:
  rabbitmq_data:
