# Retour rapide avant chaque push. La CI rejoue les mêmes contrôles sur la branche poussée.
# Installation : make install
# Les hooks locaux utilisent server/.venv et client/node_modules, préparés par make install.
default_install_hook_types: [pre-push]
default_stages: [pre-push]

repos:
  # Secrets dans les commits poussés (et non dans les fichiers indexés : on est en pre-push)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: >-
          bash -c 'gitleaks git --redact --verbose --no-banner
          --log-opts="--no-merges $PRE_COMMIT_FROM_REF..$PRE_COMMIT_TO_REF" .'
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--config, server/ruff.toml]
        files: ^server/

  - repo: local
    hooks:
      - id: server-unit-tests
        name: tests unitaires du serveur
        entry: bash -c 'cd server && .venv/bin/python -m pytest -m unit -q'
        language: system
        files: ^server/
        pass_filenames: false

      - id: client-lint
        name: ESLint du client
        entry: npm --prefix client run lint
        language: system
        files: ^client/
        pass_filenames: false

      - id: client-typecheck
        name: types du client
        entry: npm --prefix client run typecheck
        language: system
        files: ^client/
        pass_filenames: false
